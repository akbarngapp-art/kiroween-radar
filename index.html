<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radar — Opportunity Watchdog</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --text:      #e2e8f0;
      --muted:     #718096;
      --accent:    #7c3aed;
      --verified:  #10b981;
      --disputed:  #f59e0b;
      --unavail:   #ef4444;
      --stale:     #f59e0b;
      --radius:    8px;
      --gap:       1.25rem;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      max-width: 900px;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .logo span { color: var(--accent); }

    #refresh-btn {
      cursor: pointer;
      background: rgba(124, 58, 237, 0.12);
      color: var(--accent);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: var(--radius);
      padding: 0.3rem 0.9rem;
      font-size: 0.85rem;
      font-family: inherit;
      transition: background 0.15s;
    }
    #refresh-btn:hover {
      background: rgba(124, 58, 237, 0.25);
    }

    #meta {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
    }

    #stale-banner {
      display: none;
      max-width: 900px;
      margin: 0 auto var(--gap);
      padding: 0.6rem 1rem;
      border-radius: var(--radius);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--stale);
      font-size: 0.85rem;
    }

    #status {
      max-width: 900px;
      margin: 0 auto;
    }

    .empty-state, .error-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }
    .empty-state .icon, .error-state .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: block;
    }
    .empty-state h2, .error-state h2 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .error-state { color: var(--unavail); }
    .error-state h2 { color: var(--unavail); }

    #events {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      gap: var(--gap);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem 1rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .asset-name {
      font-size: 1rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .source-tag {
      font-size: 0.72rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.15);
      color: var(--accent);
      border: 1px solid rgba(124, 58, 237, 0.3);
      font-family: monospace;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }
    .badge-verified   { background: rgba(16,185,129,0.12); color: var(--verified); border: 1px solid rgba(16,185,129,0.3); }
    .badge-disputed   { background: rgba(245,158,11,0.12); color: var(--disputed); border: 1px solid rgba(245,158,11,0.3); }
    .badge-unavailable{ background: rgba(239,68,68,0.12);  color: var(--unavail);  border: 1px solid rgba(239,68,68,0.3); }

    .change-pct {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: right;
      line-height: 1.2;
    }
    .change-pct.up   { color: var(--verified); }
    .change-pct.down { color: var(--unavail); }

    .card-body {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-top: 0.25rem;
    }

    .stat { display: flex; flex-direction: column; gap: 0.1rem; }
    .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-value { font-size: 0.95rem; font-weight: 500; font-variant-numeric: tabular-nums; }
    .stat-value a { color: var(--accent); text-decoration: none; }
    .stat-value a:hover { text-decoration: underline; }

    .evidence-toggle {
      grid-column: 1 / -1;
      margin-top: 0.5rem;
    }
    .evidence-toggle summary {
      cursor: pointer;
      font-size: 0.78rem;
      color: var(--muted);
      user-select: none;
    }
    .evidence-toggle summary:hover { color: var(--text); }
    .evidence-pre {
      margin-top: 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.78rem;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--muted);
      max-height: 160px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">⬡ <span>Radar</span></div>
    <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
      <button id="refresh-btn" onclick="loadReport()" title="Reload report.json">↺ Refresh</button>
      <div id="meta">Loading…</div>
    </div>
  </header>

  <div id="stale-banner">⚠ Report is stale — data may be outdated.</div>

  <div id="status"></div>
  <div id="events"></div>

  <script>
    const STALENESS_MS = 15 * 60 * 1000; // 15 minutes

    function fmtDate(iso) {
      if (!iso) return 'n/a';
      try {
        return new Date(iso).toLocaleString(undefined, {
          year: 'numeric', month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit',
        });
      } catch { return iso; }
    }

    function badgeClass(outcome) {
      if (outcome === 'verified')    return 'badge-verified';
      if (outcome === 'disputed')    return 'badge-disputed';
      return 'badge-unavailable';
    }

    function badgeIcon(outcome) {
      if (outcome === 'verified')    return '✓';
      if (outcome === 'disputed')    return '⚠';
      return '✗';
    }

    function renderCard(ev) {
      const outcome = ev.verification?.outcome ?? 'unavailable';
      const evidenceJson = ev.verification?.evidence
        ? JSON.stringify(ev.verification.evidence, null, 2)
        : null;

      const evidenceBlock = evidenceJson ? `
          <details class="evidence-toggle">
            <summary>Show evidence</summary>
            <pre class="evidence-pre">${esc(evidenceJson)}</pre>
          </details>` : '';

      if (ev.type === 'new-release') {
        const repo  = ev.asset ?? ev.repo ?? 'unknown';
        const tag   = ev.detectedValue ?? ev.tag ?? 'unknown';
        const title = ev.title ?? '';
        const link  = ev.link  ?? null;

        return `
        <div class="card">
          <div class="card-header">
            <span class="asset-name">${esc(repo)}</span>
            <span class="source-tag">${esc(ev.sourceId ?? '')}</span>
            <span class="badge ${badgeClass(outcome)}">${badgeIcon(outcome)} ${esc(outcome)}</span>
          </div>
          <div class="change-pct up" style="font-size:1.1rem;">${esc(tag)}</div>
          <div class="card-body">
            <div class="stat">
              <span class="stat-label">Tag</span>
              <span class="stat-value">${esc(tag)}</span>
            </div>
            ${title ? `
            <div class="stat">
              <span class="stat-label">Title</span>
              <span class="stat-value">${esc(title)}</span>
            </div>` : ''}
            ${ev.detectedAt ? `
            <div class="stat">
              <span class="stat-label">Detected at</span>
              <span class="stat-value">${fmtDate(ev.detectedAt)}</span>
            </div>` : ''}
            ${ev.approvedAt ? `
            <div class="stat">
              <span class="stat-label">Approved at</span>
              <span class="stat-value">${fmtDate(ev.approvedAt)}</span>
            </div>` : ''}
            ${ev.verification?.source ? `
            <div class="stat">
              <span class="stat-label">Verified by</span>
              <span class="stat-value">${esc(ev.verification.source)}</span>
            </div>` : ''}
            ${link ? `
            <div class="stat">
              <span class="stat-label">Link</span>
              <span class="stat-value"><a href="${esc(link)}" target="_blank" rel="noopener noreferrer">View release ↗</a></span>
            </div>` : ''}
          </div>
          ${evidenceBlock}
        </div>`;
      }

      // Price-move card (original layout)
      const changePct = ev.changePct ?? 0;
      const direction = changePct >= 0 ? 'up' : 'down';
      const sign = changePct >= 0 ? '+' : '';
      const currency = 'USD';

      return `
        <div class="card">
          <div class="card-header">
            <span class="asset-name">${esc(ev.asset ?? 'unknown')}</span>
            <span class="source-tag">${esc(ev.sourceId ?? '')}</span>
            <span class="badge ${badgeClass(outcome)}">${badgeIcon(outcome)} ${esc(outcome)}</span>
          </div>
          <div class="change-pct ${direction}">${sign}${changePct}%</div>
          <div class="card-body">
            <div class="stat">
              <span class="stat-label">Current</span>
              <span class="stat-value">${currency} ${fmtPrice(ev.detectedValue)}</span>
            </div>
            <div class="stat">
              <span class="stat-label">Previous</span>
              <span class="stat-value">${currency} ${fmtPrice(ev.previousValue)}</span>
            </div>
            <div class="stat">
              <span class="stat-label">Detected at</span>
              <span class="stat-value">${fmtDate(ev.detectedAt)}</span>
            </div>
            ${ev.approvedAt ? `
            <div class="stat">
              <span class="stat-label">Approved at</span>
              <span class="stat-value">${fmtDate(ev.approvedAt)}</span>
            </div>` : ''}
            ${ev.verification?.source ? `
            <div class="stat">
              <span class="stat-label">Verified by</span>
              <span class="stat-value">${esc(ev.verification.source)}</span>
            </div>` : ''}
          </div>
          ${evidenceBlock}
        </div>`;
    }

    function fmtPrice(val) {
      if (val == null) return 'n/a';
      return Number(val).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showError(msg) {
      document.getElementById('status').innerHTML = `
        <div class="error-state">
          <span class="icon">⚡</span>
          <h2>Could not load report</h2>
          <p>${esc(msg)}</p>
        </div>`;
    }

    async function loadReport() {
      let raw;
      try {
        const resp = await fetch('./report.json');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        raw = await resp.text();
      } catch (err) {
        showError(`Failed to fetch report.json — ${err.message}`);
        document.getElementById('meta').textContent = 'Report unavailable';
        return;
      }

      let report;
      try {
        report = JSON.parse(raw);
      } catch (err) {
        showError(`report.json is not valid JSON — ${err.message}`);
        document.getElementById('meta').textContent = 'Report malformed';
        return;
      }

      const generatedAt = report.generatedAt;
      const events = Array.isArray(report.events) ? report.events : [];

      document.getElementById('meta').innerHTML =
        `Report generated: <strong>${fmtDate(generatedAt)}</strong> &nbsp;·&nbsp; ${events.length} event(s)`;

      // Staleness check
      if (generatedAt) {
        const age = Date.now() - new Date(generatedAt).getTime();
        if (age > STALENESS_MS) {
          const banner = document.getElementById('stale-banner');
          const mins = Math.round(age / 60000);
          banner.textContent = `⚠ Report is stale — generated ${mins} minutes ago. Data may be outdated.`;
          banner.style.display = 'block';
        }
      }

      const container = document.getElementById('events');
      if (events.length === 0) {
        document.getElementById('status').innerHTML = `
          <div class="empty-state">
            <span class="icon">🔭</span>
            <h2>No approved events yet</h2>
            <p>Radar hasn't approved any events for publication. Run the poller and approve candidates via the CLI.</p>
          </div>`;
        return;
      }

      container.innerHTML = events.map(renderCard).join('');
    }

    loadReport();
  </script>
</body>
</html>
